<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Vacunación</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800">

    <nav class="bg-blue-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex space-x-4">
                <button id="btn-tab-resultados" class="px-4 py-3 font-bold border-b-4 border-white">Resultados</button>
                <button id="btn-tab-simular" class="px-4 py-3 font-bold border-b-4 border-transparent hover:text-gray-200">Simular</button>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto p-6 mt-6 bg-white shadow-lg rounded-lg">
        
        <div id="tab-resultados">
            <div id="estado-vacio" class="flex flex-col items-center justify-center py-20 text-gray-400">
                <svg class="w-16 h-16 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <h2 class="text-2xl font-bold">No hay datos de simulación</h2>
                <p class="mt-2">Ve a la pestaña "Simular" para ejecutar una.</p>
            </div>

            <div id="estado-con-datos" class="hidden">
                <h2 class="text-2xl font-bold mb-4 text-blue-600">Métricas de la Simulación</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                    <div class="bg-gray-50 p-4 border rounded-md shadow-sm">
                        <canvas id="graficoRechazos"></canvas>
                    </div>
                    <div class="bg-gray-50 p-4 border rounded-md shadow-sm">
                        <canvas id="graficoTiempos"></canvas>
                    </div>
                </div>

                <h2 class="text-2xl font-bold mb-4 text-blue-600">Vector de Estado (Iteraciones solicitadas + Momento X)</h2>
                <div class="overflow-x-auto border rounded-md shadow-sm">
                    <table class="min-w-full text-sm text-left">
                        <thead class="bg-blue-100 text-blue-900 sticky top-0" id="tabla-head">
                            </thead>
                        <tbody id="tabla-body" class="divide-y divide-gray-200">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="tab-simular" class="hidden">
            <h2 class="text-2xl font-bold mb-6 text-blue-600">Configuración de Parámetros</h2>
            <form id="form-simulacion" class="space-y-6">
                
                <div class="bg-blue-50 p-4 rounded-md border border-blue-200">
                    <label class="block text-sm font-bold text-gray-700">Tiempo total de simulación (X) [Minutos]</label>
                    <input type="number" step="0.1" id="tiempo_simulacion" required class="mt-1 w-full p-2 border rounded-md focus:ring-blue-500 focus:border-blue-500">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-medium">Cant. Iteraciones (N)</label>
                        <input type="number" id="max_iteraciones" required disabled class="mt-1 w-full p-2 border rounded-md bg-gray-100 disabled:opacity-50">
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Iteraciones a mostrar (i)</label>
                        <input type="number" id="cantidad_iteraciones_mostrar" required disabled class="mt-1 w-full p-2 border rounded-md bg-gray-100 disabled:opacity-50">
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Mostrar desde hora (j)</label>
                        <input type="number" step="0.1" id="mostrar_desde_hora" required disabled class="mt-1 w-full p-2 border rounded-md bg-gray-100 disabled:opacity-50">
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Media Llegadas (mu)</label>
                        <input type="number" step="0.1" id="media_llegadas" value="6" required disabled class="mt-1 w-full p-2 border rounded-md bg-gray-100 disabled:opacity-50">
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Vacunación Mínima (a)</label>
                        <input type="number" step="0.1" id="vacunacion_min" value="3" required disabled class="mt-1 w-full p-2 border rounded-md bg-gray-100 disabled:opacity-50">
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Vacunación Máxima (b)</label>
                        <input type="number" step="0.1" id="vacunacion_max" value="7" required disabled class="mt-1 w-full p-2 border rounded-md bg-gray-100 disabled:opacity-50">
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Tiempo Observación (k)</label>
                        <input type="number" step="0.1" id="tiempo_observacion" value="15" required disabled class="mt-1 w-full p-2 border rounded-md bg-gray-100 disabled:opacity-50">
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Capacidad Obs. (l)</label>
                        <input type="number" id="capacidad_observacion" value="20" required disabled class="mt-1 w-full p-2 border rounded-md bg-gray-100 disabled:opacity-50">
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Capacidad Fila (p)</label>
                        <input type="number" id="capacidad_cola_externa" value="10" required disabled class="mt-1 w-full p-2 border rounded-md bg-gray-100 disabled:opacity-50">
                    </div>
                </div>

                <div class="flex space-x-4 pt-4 border-t">
                    <button type="button" id="btn-iniciar" disabled class="bg-blue-600 text-white px-6 py-2 rounded-md font-bold hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed">
                        Iniciar Simulación
                    </button>
                    <button type="button" id="btn-limpiar" class="bg-gray-400 text-white px-6 py-2 rounded-md font-bold hover:bg-gray-500">
                        Limpiar Datos
                    </button>
                </div>
                <div id="loading-msg" class="hidden text-blue-600 font-bold mt-2">Simulando... por favor espere.</div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
